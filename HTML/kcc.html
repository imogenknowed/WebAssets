<!DOCTYPE html>
<html>
<head>
<style>
  .mobile-row {
    display: flex !important;
    flex-direction: row !important;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 8px;
  }

  .mobile-row a {
    flex: 1; /* Forces all 3 book slots to keep equal size */
    display: block;
  }

  .mobile-row img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }

  /* Full-width character art underneath */
  .character-art {
    width: 100%;
    margin-top: 8px;
  }

  .character-art img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>

<body>

<!-- Book Covers -->
<div class="mobile-row">

  <!-- KCC1 -->
  <a href="https://books.imogenknowed.com/qhd6chy1xk" target="_blank">
    <img class="small-img" 
    src="https://imogenknowed.github.io/WebAssets/BookCovers/KCC1.png" 
    alt="Knot of Christmas Past">
  </a>

  <!-- KCC2 -->
  <a href="https://books.imogenknowed.com/h0ik6mnbns" target="_blank">
    <img class="small-img"
    src="https://imogenknowed.github.io/WebAssets/BookCovers/KCC2.png" 
    alt="Knot of Christmas Present">
  </a>

  <!-- KCC3 -->
  <a href="https://books.imogenknowed.com/xm3d007626" target="_blank">
    <img class="small-img"
    src="https://imogenknowed.github.io/WebAssets/BookCovers/KCC3.png" 
    alt="Knot of Christmas Yet to Come">
  </a>

</div>

<!-- Character Art -->
<div class="character-art">
  <img src="https://imogenknowed.github.io/WebAssets/CharacterArt/KCCCharacters.png"
  alt="Characters">
</div>

</body>
</html>
